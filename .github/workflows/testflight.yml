name: TestFlight

# Upload requires App Store Connect API key secrets on this repo.
# Mac mini: `./scripts/testflight.sh` is equivalent when secrets live in the shell.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "Scooter/**"
      - "Scooter.xcodeproj/**"
      - "project.yml"
      - "scripts/testflight.sh"
      - ".github/workflows/testflight.yml"

permissions:
  contents: read

concurrency:
  group: testflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  upload:
    runs-on: [self-hosted, macos, mac-mini]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install XcodeGen
        # launchd jobs get a bare PATH; call brew by absolute path instead of adding
        # /opt/homebrew/bin to PATH — Homebrew rsync shadows /usr/bin/rsync and
        # breaks xcodebuild -exportArchive ("Copy failed", rsync 3.5.0 usage error).
        run: command -v xcodegen >/dev/null || /opt/homebrew/bin/brew install xcodegen

      - name: Write App Store Connect API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -euo pipefail
          test -n "${ASC_KEY_P8}"
          mkdir -p "$HOME/keys"
          printf '%s' "$ASC_KEY_P8" > "$HOME/keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8"
          chmod 600 "$HOME/keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8"

      - name: Unlock CI signing keychain
        if: runner.environment == 'self-hosted'
        env:
          KC_PASSWORD: ${{ secrets.KC_PASSWORD }}
        run: |
          set -euo pipefail
          KC="$HOME/Library/Keychains/scooter-build.keychain-db"
          security unlock-keychain -p "$KC_PASSWORD" "$KC"
          security list-keychains -d user -s "$KC" "$HOME/Library/Keychains/login.keychain-db" /Library/Keychains/System.keychain

      - name: Archive and upload
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_PATH: ${{ github.workspace }}/../keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          export PATH="/usr/bin:/bin:/opt/homebrew/bin:$PATH"
          export ASC_KEY_PATH="$HOME/keys/AuthKey_${ASC_KEY_ID}.p8"
          test -f "$ASC_KEY_PATH"
          ./scripts/testflight.sh
