name: TestFlight

# Paths to TestFlight:
#   1) Push a tag `ios-vX.Y.Z` (for example ios-v1.2.3) — creates a GitHub release.
#   2) Push to main — uploads when non-docs paths changed (no GitHub release).
#   3) workflow_dispatch with a typed marketing version.
#   MARKETING_VERSION       = tag without `ios-v`, or dispatch input, or latest ios-v* tag on main
#   CURRENT_PROJECT_VERSION = github.run_number + 20261104000000 (the offset is above every build
#                             already uploaded for this app; never lower it)
# The release job runs on the self-hosted `promax` Mac runner; set the repo variable IOS_RUNNER to
# "macos-26" to use a GitHub-hosted runner instead (see RELEASING in the README).
# Pull requests only build unsigned on GitHub-hosted runners, with no secrets, and never use a
# self-hosted runner. Docs-only changes skip the iOS build.
# Same script by hand on a Mac: scripts/ci-testflight.sh (see RELEASING in the README).
on:
  pull_request:
    paths:
      - "Scooter/**"
      - "Package.swift"
      - "project.yml"
      - "scripts/**"
      - "xtool.yml"
      - ".github/workflows/testflight.yml"
  push:
    tags: ["ios-v*"]
    branches: [main]
  workflow_dispatch:
    inputs:
      marketing_version:
        description: "Marketing version X.Y.Z (the tag supplies it on tag pushes)"
        required: true

permissions:
  contents: write # create the GitHub release for the tag

concurrency:
  group: testflight-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    # Pull requests: unsigned build and tests only. No secrets are used in this job.
    if: github.event_name == 'pull_request'
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Cache SPM and DerivedData
        uses: actions/cache@v4
        with:
          path: |
            .derived
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-scooter-spm-${{ hashFiles('Package.swift', 'project.yml') }}
          restore-keys: ${{ runner.os }}-scooter-spm-
      - name: Install XcodeGen
        run: command -v xcodegen >/dev/null || brew install xcodegen
      - name: Unsigned simulator build
        run: |
          export PATH="/usr/bin:/bin:/usr/sbin:/sbin:/opt/homebrew/bin:/usr/local/bin"
          # The tracked project can lag newly added sources; generate from scratch.
          rm -rf Scooter.xcodeproj
          xcodegen generate
          xcodebuild build -project Scooter.xcodeproj -scheme Scooter \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath .derived \
            CODE_SIGNING_ALLOWED=NO -quiet

  upload:
    # Tag pushes and manual runs only; pull requests never reach the signing job.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ fromJSON(vars.IOS_RUNNER || '["self-hosted","macOS","promax"]') }}
    timeout-minutes: 60
    env:
      BUILD_OFFSET: "20261104000000"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Gate main-branch uploads to non-docs changes
        id: gate
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          before="${{ github.event.before }}"
          if [[ -z "$before" || "$before" =~ ^0+$ ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "No before SHA; running upload."
            exit 0
          fi
          changed="$(git diff --name-only "$before" "${{ github.sha }}")"
          if printf '%s\n' "$changed" | grep -Ev '(\.(md|MD)$|^docs/|^LICENSE$|^\.gitignore$|^reference/)' >/dev/null; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Non-docs paths changed; running upload."
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Docs-only change on main; skipping TestFlight upload."
          fi

      - name: Resolve version and build number
        if: steps.gate.outcome == 'skipped' || steps.gate.outputs.run == 'true'
        env:
          INPUT_VERSION: ${{ inputs.marketing_version }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#ios-v}"
          elif [[ -n "${INPUT_VERSION:-}" ]]; then
            version="$INPUT_VERSION"
          else
            # Main-branch auto upload: reuse the latest ios-v* marketing version.
            version="$(git tag -l 'ios-v*' --sort=-v:refname | head -n1 | sed 's/^ios-v//')"
            if [[ -z "$version" ]]; then
              echo "::error::No ios-v* tags found to supply MARKETING_VERSION on a main push."
              exit 1
            fi
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$version' is not X.Y.Z semver. Tag the release as ios-vX.Y.Z, for example ios-v1.2.3."
            exit 1
          fi
          {
            echo "ASC_KEY_DIR=$RUNNER_TEMP/asc"
            echo "MARKETING_VERSION=$version"
            echo "BUILD_NUMBER=$((BUILD_OFFSET + GITHUB_RUN_NUMBER))"
          } >> "$GITHUB_ENV"
          echo "Version $version, build $((BUILD_OFFSET + GITHUB_RUN_NUMBER))"

      - name: Install XcodeGen
        if: steps.gate.outcome == 'skipped' || steps.gate.outputs.run == 'true'
        # launchd jobs get a bare PATH; call brew by absolute path instead of adding
        # /opt/homebrew/bin to PATH: Homebrew rsync shadows /usr/bin/rsync and
        # breaks xcodebuild -exportArchive ("Copy failed", rsync 3.5.0 usage error).
        run: command -v xcodegen >/dev/null || /opt/homebrew/bin/brew install xcodegen


      - name: Write App Store Connect API key
        if: steps.gate.outcome == 'skipped' || steps.gate.outputs.run == 'true'
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          set -euo pipefail
          test -n "$ASC_KEY_P8"
          umask 077
          mkdir -p "$ASC_KEY_DIR"
          printf '%s' "$ASC_KEY_P8" > "$ASC_KEY_DIR/AuthKey_$ASC_KEY_ID.p8"

      - name: Unlock login keychain
        if: (steps.gate.outcome == 'skipped' || steps.gate.outputs.run == 'true') && runner.environment == 'self-hosted'
        env:
          KC_PASSWORD: ${{ secrets.KC_PASSWORD }}
        run: |
          set -euo pipefail
          # The runner Mac's own login keychain; no keychains are created and the search list is left alone.
          KC="$HOME/Library/Keychains/login.keychain-db"
          security unlock-keychain -p "$KC_PASSWORD" "$KC"
          # Lets codesign use the private key non-interactively (else errSecInternalComponent).
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PASSWORD" "$KC" >/dev/null

      - name: Archive, export, upload
        if: steps.gate.outcome == 'skipped' || steps.gate.outputs.run == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          export PATH="/usr/bin:/bin:/opt/homebrew/bin:/usr/local/bin:$PATH"
          export ASC_KEY_PATH="$ASC_KEY_DIR/AuthKey_$ASC_KEY_ID.p8"
          test -f "$ASC_KEY_PATH"
          ./scripts/ci-testflight.sh

      - name: Create GitHub release
        if: (steps.gate.outcome == 'skipped' || steps.gate.outputs.run == 'true') && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          export PATH="/usr/bin:/bin:/opt/homebrew/bin:$PATH"
          command -v gh >/dev/null || /opt/homebrew/bin/brew install gh
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "Scooter $MARKETING_VERSION" --generate-notes \
            --notes "Uploaded to TestFlight as version $MARKETING_VERSION, build $BUILD_NUMBER."

      - name: Remove the API key
        if: always() && (steps.gate.outcome == 'skipped' || steps.gate.outputs.run == 'true')
        run: rm -rf "$ASC_KEY_DIR" "$HOME"/.appstoreconnect/private_keys/AuthKey_*.p8

